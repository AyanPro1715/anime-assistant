<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI VRM Chat</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif; color: #fff; }
  canvas { display: block; touch-action: none; }

  #loading { position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1a1a2e; gap: 18px; padding: 24px; text-align: center; }
  #loading .title { font-size: 20px; font-weight: 600; }
  #loading .sub { font-size: 14px; color: #ffffff80; max-width: 320px; line-height: 1.5; }
  #progressBar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #ffffff18; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: #ff6b9d; transition: width .2s ease; }
  #loading.hidden { display: none; }
  #errorBox { display: none; margin-top: 12px; padding: 12px 16px;
    background: #ff4d4d22; border: 1px solid #ff4d4d55; border-radius: 10px;
    font-size: 12px; color: #ffaaaa; max-width: 90vw; word-break: break-word;
    text-align: left; font-family: monospace; }

  #settingsBtn { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 10px;
    width: 36px; height: 36px; border-radius: 50%; background: #ffffff22;
    border: none; color: #fff; font-size: 18px; cursor: pointer; z-index: 200;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #resetCamBtn { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 54px;
    width: 36px; height: 36px; border-radius: 50%; background: #ffffff22;
    border: none; color: #fff; font-size: 16px; cursor: pointer; z-index: 200;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #debugToggle { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 10px;
    width: 36px; height: 36px; border-radius: 50%; background: #ffffff22;
    border: none; color: #fff; font-size: 14px; cursor: pointer; z-index: 200;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  #debugPanel { position: fixed; top: 55px; right: 8px; z-index: 201;
    max-width: 70vw; max-height: 45vh; overflow-y: auto;
    background: #000000dd; color: #0f0; font-family: monospace;
    font-size: 10px; padding: 8px 10px; border-radius: 8px;
    line-height: 1.4; display: none; border: 1px solid #0f0444; }
  #debugPanel.show { display: block; }
  #debugPanel .err { color: #f66; }
  #debugPanel .ok { color: #6f6; }
  #debugPanel .info { color: #6cf; }
  #debugPanel .warn { color: #fc6; }

  #settingsPanel { position: fixed; inset: 0; background: #00000099; z-index: 210;
    display: none; align-items: center; justify-content: center; padding: 20px; }
  #settingsPanel.show { display: flex; }
  #settingsInner { background: #1e1e30; border-radius: 16px; padding: 22px;
    width: min(420px, 90vw); border: 1px solid #ffffff20; }
  #settingsInner h3 { margin: 0 0 12px; font-size: 16px; }
  #settingsInner p { font-size: 12px; color: #ffffff99; line-height: 1.5; margin: 0 0 12px; }
  #settingsInner a { color: #ff6b9d; }
  #apiKeyInput { width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid #ffffff30; background: #ffffff10; color: #fff;
    font-size: 13px; font-family: monospace; outline: none; }
  #apiKeyInput:focus { border-color: #ff6b9d; }
  #settingsBtns { display: flex; gap: 10px; margin-top: 14px; }
  #settingsBtns button { flex: 1; padding: 12px; border-radius: 10px;
    border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  #saveKeyBtn { background: #ff6b9d; color: #fff; }
  #cancelKeyBtn { background: #ffffff22; color: #fff; }
  #keyStatus { font-size: 11px; margin-top: 10px; color: #8f8; font-family: monospace; }

  #bubble { position: fixed; top: max(60px, calc(env(safe-area-inset-top) + 50px)); left: 50%;
    transform: translateX(-50%); max-width: min(560px, 88vw); padding: 14px 20px; border-radius: 18px;
    background: #ffffff22; color: #fff; font-size: 15px; line-height: 1.4;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-left: 3px solid #ff6b9d; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 20; }
  #bubble.show { opacity: 1; }

  #hint { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: #ffffff60; z-index: 15; pointer-events: none;
    background: #00000040; padding: 4px 12px; border-radius: 12px; }
  #hint.hide { opacity: 0; transition: opacity .8s; }

  #chatBox { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(680px, 92vw); display: flex; gap: 8px; z-index: 10; }
  #userInput { flex: 1; padding: 14px 18px; border-radius: 30px; border: none; outline: none;
    background: #ffffff18; color: #fff; font-size: 15px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-width: 0; }
  #userInput::placeholder { color: #ffffff70; }
  #sendBtn { padding: 14px 22px; border-radius: 30px; border: none; cursor: pointer;
    background: #ff6b9d; color: #fff; font-weight: 600; font-size: 15px; flex-shrink: 0; }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  #status { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 54px;
    color: #ffffff80; font-size: 11px; z-index: 30; font-family: monospace; }
</style>
</head>
<body>

  <div id="loading">
    <div class="title">🎀 AI VRM Chat</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="sub" id="loadText">Model load ho raha hai…</div>
    <div id="errorBox"></div>
  </div>

  <button id="settingsBtn" title="Settings">⚙️</button>
  <button id="resetCamBtn" title="Reset Camera">🎯</button>
  <button id="debugToggle" title="Debug">🐞</button>
  <div id="debugPanel"></div>

  <div id="settingsPanel">
    <div id="settingsInner">
      <h3>🔑 Gemini API Key</h3>
      <p>Free key lo: <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a></p>
      <input id="apiKeyInput" type="password" placeholder="AIza..." autocomplete="off" />
      <div id="settingsBtns">
        <button id="cancelKeyBtn">Cancel</button>
        <button id="saveKeyBtn">Save</button>
      </div>
      <div id="keyStatus"></div>
    </div>
  </div>

  <div id="bubble"></div>
  <div id="status">init…</div>
  <div id="hint">💡 1-finger: ghumao · 2-finger: zoom/pan · Tap model: touch karo!</div>

  <div id="chatBox">
    <input id="userInput" placeholder="Type hello…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "https://unpkg.com/@pixiv/three-vrm-animation@3.2.0/lib/three-vrm-animation.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
import {
  createVRMAnimationClip,
  VRMAnimationLoaderPlugin,
  VRMLookAtQuaternionProxy
} from '@pixiv/three-vrm-animation';

/* ================= DEBUG PANEL ================= */
const debugPanel = document.getElementById('debugPanel');
const debugToggle = document.getElementById('debugToggle');
let debugLines = [];

debugToggle.addEventListener('click', () => {
  debugPanel.classList.toggle('show');
});

function log(msg, type = 'info') {
  const time = new Date().toLocaleTimeString('en-IN', { hour12: false }).slice(0, 8);
  const cls = type === 'error' ? 'err' : type === 'ok' ? 'ok' : type === 'warn' ? 'warn' : 'info';
  debugLines.push({ time, msg: String(msg), cls });
  if (debugLines.length > 60) debugLines.shift();
  debugPanel.innerHTML = debugLines
    .map(d => `<div class="${d.cls}">[${d.time}] ${d.msg}</div>`)
    .join('');
  debugPanel.scrollTop = debugPanel.scrollHeight;
  console.log(msg);
}

window.addEventListener('error', (e) => log('❌ ' + (e.message || e.error), 'error'));
window.addEventListener('unhandledrejection', (e) => log('❌ ' + (e.reason?.message || e.reason), 'error'));

/* ================= CONFIG ================= */
const VRM_URL = './character.vrm?v=9';
const GEMINI_MODEL = 'gemini-2.5-flash';

/* 🎬 VRMA FILES — 16 normal + 1 lazy */
const VRMA_FILES = {
  anim01: './animations/VRMA_01.vrma',
  anim02: './animations/VRMA_02.vrma',
  anim03: './animations/VRMA_03.vrma',
  anim04: './animations/VRMA_04.vrma',
  anim05: './animations/VRMA_05.vrma',
  anim06: './animations/VRMA_06.vrma',
  anim07: './animations/VRMA_07.vrma',
  anim08: './animations/VRMA_08.vrma',
  anim09: './animations/VRMA_09.vrma',
  anim10: './animations/VRMA_10.vrma',
  anim12: './animations/VRMA_12.vrma',
  anim13: './animations/VRMA_13.vrma',
  anim14: './animations/VRMA_14.vrma',
  anim15: './animations/VRMA_15.vrma',
  anim16: './animations/VRMA_16.vrma',
  anim17: './animations/VRMA_17.vrma',
  anim18: './animations/VRMA_18.vrma'
};

/* 🐢 18 MB bhaari file — sirf zaroorat pe load hogi */
const LAZY_VRMA = {
  reading: './animations/VRMA_11.vrma'
};

/* ================= DOM ================= */
const loadingEl = document.getElementById('loading');
const loadText  = document.getElementById('loadText');
const errorBox  = document.getElementById('errorBox');
const progressFill = document.getElementById('progressFill');
const statusEl  = document.getElementById('status');
const bubble    = document.getElementById('bubble');
const input     = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');
const settingsBtn = document.getElementById('settingsBtn');
const resetCamBtn = document.getElementById('resetCamBtn');
const settingsPanel = document.getElementById('settingsPanel');
const apiKeyInput = document.getElementById('apiKeyInput');
const saveKeyBtn = document.getElementById('saveKeyBtn');
const cancelKeyBtn = document.getElementById('cancelKeyBtn');
const keyStatus = document.getElementById('keyStatus');
const hintEl = document.getElementById('hint');

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = String(msg);
  loadText.textContent = '❌ Load fail ho gaya';
  log('💥 ' + msg, 'error');
}

/* ================= SETTINGS ================= */
const KEY_STORAGE = 'gemini_api_key_v1';
const getApiKey = () => localStorage.getItem(KEY_STORAGE) || '';
const setApiKey = (k) => { k ? localStorage.setItem(KEY_STORAGE, k) : localStorage.removeItem(KEY_STORAGE); };

settingsBtn.addEventListener('click', () => {
  apiKeyInput.value = getApiKey();
  keyStatus.textContent = '';
  settingsPanel.classList.add('show');
});
cancelKeyBtn.addEventListener('click', () => settingsPanel.classList.remove('show'));
saveKeyBtn.addEventListener('click', () => {
  setApiKey(apiKeyInput.value.trim());
  keyStatus.textContent = apiKeyInput.value.trim() ? '✅ Saved!' : '🗑️ Cleared';
  setTimeout(() => settingsPanel.classList.remove('show'), 600);
});

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 100);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ============ COMPLETE FREE CAMERA ============ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;
controls.enableZoom = true;
controls.enableRotate = true;
controls.screenSpacePanning = true;
controls.minPolarAngle = 0;
controls.maxPolarAngle = Math.PI;
controls.minAzimuthAngle = -Infinity;
controls.maxAzimuthAngle = Infinity;
controls.minDistance = 0.05;
controls.maxDistance = 50;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.9;
controls.panSpeed = 1.0;
controls.touches = {
  ONE: THREE.TOUCH.ROTATE,
  TWO: THREE.TOUCH.DOLLY_PAN
};
controls.mouseButtons = {
  LEFT: THREE.MOUSE.ROTATE,
  MIDDLE: THREE.MOUSE.DOLLY,
  RIGHT: THREE.MOUSE.PAN
};

/* ================= LIGHTS ================= */
scene.add(new THREE.AmbientLight(0xffffff, 1.5));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(1, 3, 2); scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88aaff, 1.0);
rimLight.position.set(-2, 2, -1); scene.add(rimLight);
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(0, 1, 3); scene.add(fillLight);

/* ================= VRM LOAD ================= */
let vrm = null;
let mixer = null;
const vrmaClips = {};
let currentVRMAction = null;
const clock = new THREE.Clock();

let defaultCameraPos = new THREE.Vector3(0, 1, 3);
let defaultCameraTarget = new THREE.Vector3(0, 1, 0);

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.register(parser => new VRMAnimationLoaderPlugin(parser));

log('🚀 VRM loading start', 'info');

loader.load(VRM_URL, async (gltf) => {
  try {
    vrm = gltf.userData.vrm;
    if (!vrm) throw new Error('VRM data missing');

    if (VRMUtils.removeUnnecessaryVertices) VRMUtils.removeUnnecessaryVertices(gltf.scene);
    if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
    if (VRMUtils.combineMorphs) VRMUtils.combineMorphs(vrm);

    VRMUtils.rotateVRM0(vrm);

    vrm.scene.position.set(0, 0, 0);
    scene.add(vrm.scene);
    vrm.scene.updateMatrixWorld(true);

    const lookAtQuatProxy = new VRMLookAtQuaternionProxy(vrm.lookAt);
    lookAtQuatProxy.name = 'lookAtQuaternionProxy';
    vrm.scene.add(lookAtQuatProxy);

    const box = new THREE.Box3().setFromObject(vrm.scene);
    const size = new THREE.Vector3();
    const center = new THREE.Vector3();
    box.getSize(size);
    box.getCenter(center);

    vrm.scene.position.set(-center.x, -box.min.y, -center.z);
    vrm.scene.updateMatrixWorld(true);

    const box2 = new THREE.Box3().setFromObject(vrm.scene);
    const size2 = new THREE.Vector3();
    const center2 = new THREE.Vector3();
    box2.getSize(size2);
    box2.getCenter(center2);

    const h = size2.y || 1.5;
    log('📏 VRM height: ' + h.toFixed(2), 'ok');

    const modelMidY = h * 0.5;
    const fovRad = camera.fov * Math.PI / 180;
    let camDist = (h * 1.20) / (2 * Math.tan(fovRad / 2));
    if (innerWidth < innerHeight) camDist *= 1.10;

    defaultCameraPos.set(0, modelMidY, camDist);
    defaultCameraTarget.set(0, modelMidY, 0);

    camera.position.copy(defaultCameraPos);
    camera.lookAt(0, modelMidY, 0);
    camera.updateProjectionMatrix();

    controls.target.copy(defaultCameraTarget);
    controls.update();

    statusEl.textContent = 'ready';
    loadingEl.classList.add('hidden');
    captureBones();

    mixer = new THREE.AnimationMixer(vrm.scene);

    log('🎬 VRMA loading start', 'info');
    loadAllVRMA();

    setTimeout(() => {
      if (vrmaClips['anim02']) {
        playVRMA('anim02');
        setExpression('greeting', 1.0);
      } else {
        startMotion('wave', 1.0);
        setExpression('greeting', 1.0);
      }
    }, 400);
    setTimeout(() => hintEl.classList.add('hide'), 6000);

    animate();
  } catch (e) {
    log('❌ Setup: ' + (e.message || e), 'error');
    showError('Setup error: ' + (e.message || e));
  }
}, (progress) => {
  if (progress.total) {
    const pct = Math.round((progress.loaded / progress.total) * 100);
    progressFill.style.width = pct + '%';
    loadText.textContent = `Model load ho raha hai… ${pct}%`;
    statusEl.textContent = pct + '%';
  } else {
    loadText.textContent = `Model load ho raha hai… ${(progress.loaded / 1048576).toFixed(1)} MB`;
  }
}, (err) => {
  log('❌ VRM fetch: ' + (err?.message || err), 'error');
  showError(err?.message || String(err));
  statusEl.textContent = 'failed';
});

/* ================= RESET CAMERA ================= */
resetCamBtn.addEventListener('click', () => {
  camera.position.copy(defaultCameraPos);
  camera.lookAt(defaultCameraTarget);
  controls.target.copy(defaultCameraTarget);
  controls.update();
  log('🎯 Camera reset', 'info');
});

/* ================= VRMA LOADING ================= */
async function loadAllVRMA() {
  const names = Object.keys(VRMA_FILES);
  statusEl.textContent = 'animations…';

  const results = await Promise.allSettled(
    names.map(async (name) => {
      try {
        const gltf = await loader.loadAsync(VRMA_FILES[name]);
        const vrmAnim = gltf.userData.vrmAnimations?.[0];
        if (!vrmAnim) throw new Error('No VRMA data');
        const clip = createVRMAnimationClip(vrmAnim, vrm);
        vrmaClips[name] = clip;
        log(`✅ ${name} (${clip.duration.toFixed(1)}s)`, 'ok');
        return name;
      } catch (e) {
        log(`❌ ${name}: ${e.message || e}`, 'error');
        throw e;
      }
    })
  );

  const loaded = results.filter(r => r.status === 'fulfilled').length;
  log(`📊 VRMA: ${loaded}/${names.length}`, loaded === names.length ? 'ok' : 'warn');
  statusEl.textContent = 'ready';
}

async function loadLazyVRMA(name) {
  if (vrmaClips[name]) return true;
  if (!LAZY_VRMA[name]) return false;

  statusEl.textContent = 'loading ' + name + '…';
  log('🐢 Lazy loading: ' + name, 'info');
  try {
    const gltf = await loader.loadAsync(LAZY_VRMA[name]);
    const vrmAnim = gltf.userData.vrmAnimations?.[0];
    if (!vrmAnim) throw new Error('No VRMA data');
    vrmaClips[name] = createVRMAnimationClip(vrmAnim, vrm);
    log(`✅ ${name} (${vrmaClips[name].duration.toFixed(1)}s)`, 'ok');
    statusEl.textContent = 'ready';
    return true;
  } catch (e) {
    log('❌ Lazy fail: ' + name, 'error');
    statusEl.textContent = 'ready';
    return false;
  }
}

/* ================= VRMA PLAYBACK ================= */
function playVRMA(name, fadeIn = 0.3) {
  const clip = vrmaClips[name];
  if (!clip || !mixer) {
    log('⚠️ playVRMA: no clip ' + name, 'warn');
    return false;
  }

  if (currentVRMAction) {
    try { currentVRMAction.stop(); } catch {}
    currentVRMAction = null;
  }

  const action = mixer.clipAction(clip);
  action.reset();
  action.setLoop(THREE.LoopOnce, 1);
  action.clampWhenFinished = true;
  action.fadeIn(fadeIn);
  action.play();

  currentVRMAction = action;
  log('▶️ ' + name, 'info');

  const onFinished = (e) => {
    if (e.action !== action) return;
    mixer.removeEventListener('finished', onFinished);

    try { action.fadeOut(0.3); } catch {}

    setTimeout(() => {
      try {
        action.stop();
        action.enabled = false;
        action.setEffectiveWeight(0);
      } catch (err) {}

      try { mixer.stopAllAction(); } catch {}
      try { mixer.uncacheRoot(vrm.scene); } catch (err) {}

      currentVRMAction = null;
      motionName = 'idle';
      motionStart = performance.now();

      resetToIdlePose();
      requestAnimationFrame(() => resetToIdlePose());
      setTimeout(() => resetToIdlePose(), 30);
      setTimeout(() => resetToIdlePose(), 80);
      setTimeout(() => resetToIdlePose(), 150);
      setTimeout(() => resetToIdlePose(), 300);

      log('✅ idle reset', 'ok');
    }, 320);
  };

  mixer.addEventListener('finished', onFinished);
  return true;
}

/* ================= IDLE POSE RESET (HARD) ================= */
function resetToIdlePose() {
  if (!vrm?.humanoid) return;

  const names = [
    'hips','spine','chest','upperChest','neck','head',
    'leftShoulder','rightShoulder',
    'leftUpperArm','rightUpperArm',
    'leftLowerArm','rightLowerArm',
    'leftHand','rightHand',
    'leftUpperLeg','rightUpperLeg',
    'leftLowerLeg','rightLowerLeg',
    'leftFoot','rightFoot',
    'leftToes','rightToes'
  ];

  names.forEach(n => {
    const node = vrm.humanoid.getNormalizedBoneNode(n);
    if (node) {
      node.quaternion.set(0, 0, 0, 1);
      node.rotation.set(0, 0, 0);
      node.position.set(0, 0, 0);
      node.scale.set(1, 1, 1);
    }
  });

  const lArm = vrm.humanoid.getNormalizedBoneNode('leftUpperArm');
  const rArm = vrm.humanoid.getNormalizedBoneNode('rightUpperArm');
  if (lArm) {
    lArm.quaternion.set(0, 0, 0, 1);
    lArm.rotation.set(0, 0, -1.15);
  }
  if (rArm) {
    rArm.quaternion.set(0, 0, 0, 1);
    rArm.rotation.set(0, 0, 1.15);
  }

  const chest = vrm.humanoid.getNormalizedBoneNode('chest');
  const spine = vrm.humanoid.getNormalizedBoneNode('spine');
  if (chest) { chest.quaternion.set(0, 0, 0, 1); chest.rotation.x = 0.015; }
  if (spine) { spine.quaternion.set(0, 0, 0, 1); spine.rotation.x = 0.005; }
}

/* ================= BONE CACHE ================= */
const bones = {};
function captureBones() {
  if (!vrm?.humanoid) return;
  ['hips','spine','chest','upperChest','neck','head',
   'leftShoulder','rightShoulder',
   'leftUpperArm','rightUpperArm',
   'leftLowerArm','rightLowerArm',
   'leftHand','rightHand',
   'leftUpperLeg','rightUpperLeg','leftLowerLeg','rightLowerLeg'
  ].forEach(n => bones[n] = vrm.humanoid.getNormalizedBoneNode(n));
}

/* ================= EXPRESSIONS ================= */
const ALL_EXPR = [
  'happy','angry','sad','relaxed','surprised','neutral',
  'aa','ih','ou','ee','oh',
  'blink','blinkLeft','blinkRight'
];

const COMPOSITE = {
  neutral:   { neutral: 1 },
  happy:     { happy: 1 },
  angry:     { angry: 1 },

const exprCur = {}; const exprTgt = {};
for (const n of ALL_EXPR) { exprCur[n] = 0; exprTgt[n] = 0; }
exprCur.neutral = 1; exprTgt.neutral = 1;

function setExpression(name, weight = 1.0) {
  const combo = COMPOSITE[name] || COMPOSITE.neutral;
  for (const n of ALL_EXPR) exprTgt[n] = 0;
  for (const [k, v] of Object.entries(combo)) {
    if (k in exprTgt) exprTgt[k] = v * weight;
  }
}

function updateExpressions(dt) {
  if (!vrm?.expressionManager) return;
  const speed = 1 - Math.pow(0.001, dt * 6);
  for (const n of ALL_EXPR) {
    exprCur[n] += (exprTgt[n] - exprCur[n]) * speed;
    try { vrm.expressionManager.setValue(n, exprCur[n]); } catch {}
  }
}

function startMotion(name, intensity = 1.0) {

/* ================= HELPERS ================= */
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

let lastTouchTime = 0;
let touchSpamCount = 0;

function getTouchZone(object) {
  // Mesh/bone naam upar se traverse karke best-match zone dhoondhna
  let node = object;
  const nameChain = [];
  while (node) {
    if (node.name) nameChain.push(node.name.toLowerCase());
    node = node.parent;
  }
  const fullName = nameChain.join(' ');

  for (const zone of TOUCH_ZONES) {
    for (const kw of zone.match) {
      if (fullName.includes(kw)) return zone.key;
    }
  }
  return null;
}

function getTouchZoneByHeight(point) {
  // Fallback: agar naam se match na ho, to Y-height (world space) ke hisaab se guess karo
  if (!vrm?.scene) return 'head';
  const box = new THREE.Box3().setFromObject(vrm.scene);
  const h = box.max.y - box.min.y || 1.6;
  const relY = (point.y - box.min.y) / h;

  if (relY > 0.88) return 'hair';
  if (relY > 0.78) return 'head';
  if (relY > 0.65) return 'cheek';
  if (relY > 0.45) return 'shoulder';
  return 'hand';
}

function triggerTouchReaction(zoneKey) {
  const reaction = TOUCH_REACTIONS[zoneKey] || TOUCH_REACTIONS.head;

  const now = performance.now();
  if (now - lastTouchTime < 4000) {
    touchSpamCount++;
  } else {
    touchSpamCount = 0;
  }
  lastTouchTime = now;

  let line;
  if (touchSpamCount >= 3) {
    line = 'Bas bas! Bahut ho gaya, thoda rehne do~ 😤';
    setExpression('angry', 0.7);
    startMotion('crossArms', 0.8);
  } else {
    line = reaction.lines[Math.floor(Math.random() * reaction.lines.length)];
    setExpression(reaction.expression, 1.0);
    if (MOTIONS[reaction.motion]) startMotion(reaction.motion, 0.9);
  }

  bubble.textContent = line;
  bubble.classList.add('show');
  clearTimeout(triggerTouchReaction._t);
  triggerTouchReaction._t = setTimeout(() => bubble.classList.remove('show'), 2600);

  clearTimeout(triggerTouchReaction._e);
  triggerTouchReaction._e = setTimeout(() => setExpression('neutral', 0.6), 2800);

  log('👆 touch: ' + zoneKey + (touchSpamCount >= 3 ? ' (spam!)' : ''), 'info');
}

function onModelTap(clientX, clientY) {
  if (!vrm?.scene) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointerNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(vrm.scene, true);
  if (!hits.length) return;

  const hit = hits[0];
  let zone = getTouchZone(hit.object);
  if (!zone) zone = getTouchZoneByHeight(hit.point);

  triggerTouchReaction(zone);
}

// Tap vs drag/orbit differentiate karna: chhota movement + chhota time = tap
let touchStartPos = null;
let touchStartTime = 0;

renderer.domElement.addEventListener('pointerdown', (e) => {
  touchStartPos = { x: e.clientX, y: e.clientY };
  touchStartTime = performance.now();
}, { passive: true });

renderer.domElement.addEventListener('pointerup', (e) => {
  if (!touchStartPos) return;
  const dx = e.clientX - touchStartPos.x;
  const dy = e.clientY - touchStartPos.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const dt = performance.now() - touchStartTime;
  touchStartPos = null;

  // Sirf tap count hoga (drag/rotate/pinch nahi), aur single-finger hi
  if (dist < 8 && dt < 350 && e.isPrimary) {
    onModelTap(e.clientX, e.clientY);
  }
}, { passive: true });

/* ================= ANIMATION LOOP ================= */
let blinkTimer = 0, blinkState = 'open', blinkNext = 2 + Math.random() * 3;
let blinkValue = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if (vrm) {
    updateBlink(dt);
    updateExpressions(dt);

    if (currentVRMAction && !currentVRMAction.isRunning()) {
      currentVRMAction = null;
      motionName = 'idle';
      motionStart = performance.now();
    }

    if (!currentVRMAction) {
      resetToIdlePose();
      updateBody(t, dt);
    }
    vrm.update(dt);
  }

  if (mixer && currentVRMAction) {
    mixer.update(dt);
  }

  controls.update();
  renderer.render(scene, camera);
}

function updateBlink(dt) {
  blinkTimer += dt;
  if (blinkState === 'open' && blinkTimer > blinkNext) { blinkState = 'closing'; blinkTimer = 0; }
  else if (blinkState === 'closing' && blinkTimer > 0.06) { blinkState = 'opening'; blinkTimer = 0; }
  else if (blinkState === 'opening' && blinkTimer > 0.09) {
    blinkState = 'open'; blinkTimer = 0; blinkNext = 2 + Math.random() * 4;
  }
  const tgt = blinkState === 'closing' ? 1 : 0;
  blinkValue += (tgt - blinkValue) * (1 - Math.pow(0.001, dt * 20));
  try { vrm.expressionManager?.setValue('blink', blinkValue); } catch {}
}

function updateBody(t, dt) {
  if (!bones.head) return;
  const B = bones;

  const breathPhase = t * 1.6;
  const breath = Math.sin(breathPhase) * 0.5 + 0.5;
  if (B.chest)  B.chest.rotation.x  = -0.02 + breath * 0.035;
  if (B.spine)  B.spine.rotation.x  = -0.005 + breath * 0.012;

  const swayX = Math.sin(t * 0.5) * 0.008;
  const swayZ = Math.cos(t * 0.35) * 0.012;
  const bobY  = Math.sin(breathPhase * 2) * 0.004;
  if (B.hips) {
    B.hips.position.x = swayX;
    B.hips.position.y = bobY;
    B.hips.rotation.z = swayZ;
  }

  const headIdleX = Math.sin(t * 0.9) * 0.015 + Math.sin(t * 2.3) * 0.006;
  const headIdleY = Math.cos(t * 0.7) * 0.02 + Math.sin(t * 1.9) * 0.008;

  const elapsed = (performance.now() - motionStart) / 1000;
  const m = MOTIONS[motionName] || MOTIONS.idle;
  const amp = motionIntensity;

  let env = 0;
  if (m.dur > 0) {
    const riseT = 0.40, holdT = m.dur - 0.20;
    if (elapsed < riseT) env = easeOutBack(elapsed / riseT);
    else if (elapsed < holdT) env = 1;
    else if (elapsed < m.dur + 0.6) {
      const k = (elapsed - holdT) / (m.dur + 0.6 - holdT);
      env = 1 - easeInOut(clamp(k, 0, 1));
    } else { motionName = 'idle'; motionStart = performance.now(); }
  }
  const envAmp = env * amp;

  const idleLArmZ = -1.15;
  const idleRArmZ = 1.15;

  const tgtHeadX = headIdleX + (m.headX || 0) * envAmp;
  const tgtHeadY = headIdleY + (m.headY || 0) * envAmp;
  const tgtNeckX = (m.neckX || 0) * envAmp;
  const tgtNeckY = (m.neckY || 0) * envAmp;
  const tgtSpineX = (m.spineX || 0) * envAmp;
  const tgtSpineZ = (m.spineZ || 0) * envAmp + swayZ * 0.3;

  const tgtLArmX = (m.lArmX || 0) * envAmp;
  const tgtLArmY = (m.lArmY || 0) * envAmp;
  const motionLArmZ = m.lArmZ ?? idleLArmZ;
  const tgtLArmZ = idleLArmZ + (motionLArmZ - idleLArmZ) * envAmp + Math.sin(breathPhase + 0.3) * 0.008;

  const tgtLForeX = (m.lForeX || 0) * envAmp;
  const tgtLForeY = (m.lForeY || 0) * envAmp;
  const tgtLForeZ = (m.lForeZ || 0) * envAmp;

  const tgtRArmX = (m.rArmX || 0) * envAmp;
  const motionRArmZ = m.rArmZ ?? idleRArmZ;
  const tgtRArmZ = idleRArmZ + (motionRArmZ - idleRArmZ) * envAmp + Math.sin(breathPhase + 0.3) * 0.008;
  const tgtRForeX = (m.rForeX || 0) * envAmp;

  const dampHead = 1 - Math.pow(0.001, dt * 5);
  const dampNeck = 1 - Math.pow(0.001, dt * 6);
  const dampSpine = 1 - Math.pow(0.001, dt * 4.5);
  const dampArm = 1 - Math.pow(0.001, dt * 7);
  const dampFore = 1 - Math.pow(0.001, dt * 8);

  let extraBob = 0;
  if (m.bounce) extraBob = Math.sin(t * 18) * 0.02 * envAmp;
  let hopY = 0;
  if (m.hop) hopY = Math.abs(Math.sin(t * 8)) * 0.06 * envAmp;
  if (B.hips && hopY > 0) B.hips.position.y = bobY + hopY;

  if (B.head) {
    B.head.rotation.x += (tgtHeadX - B.head.rotation.x + extraBob) * dampHead;
    B.head.rotation.y += (tgtHeadY - B.head.rotation.y) * dampHead;
    const roll = Math.sin(t * 0.6) * 0.01 + (m.headY || 0) * envAmp * 0.08;
    B.head.rotation.z += (roll - B.head.rotation.z) * dampHead;
  }
  if (B.neck) {
    B.neck.rotation.x += (tgtNeckX - B.neck.rotation.x) * dampNeck;
    B.neck.rotation.y += (tgtNeckY - B.neck.rotation.y) * dampNeck;
  }
  if (B.spine) {
    B.spine.rotation.x += (tgtSpineX - B.spine.rotation.x) * dampSpine;
    B.spine.rotation.z += (tgtSpineZ - B.spine.rotation.z) * dampSpine;
  }
  if (B.upperChest) {
    B.upperChest.rotation.x += ((m.spineX || 0) * envAmp * 0.5 - B.upperChest.rotation.x) * dampSpine;
  }

  if (B.leftUpperArm) {
    B.leftUpperArm.rotation.x += (tgtLArmX - B.leftUpperArm.rotation.x) * dampArm;
    B.leftUpperArm.rotation.y += (tgtLArmY - B.leftUpperArm.rotation.y) * dampArm;
    B.leftUpperArm.rotation.z += (tgtLArmZ - B.leftUpperArm.rotation.z) * dampArm;
  }
  if (B.leftLowerArm) {
    let waveY = 0;
    if (m.wave && env > 0.25) waveY = Math.sin(t * 11) * 0.75 * envAmp;
    B.leftLowerArm.rotation.x += (tgtLForeX - B.leftLowerArm.rotation.x) * dampFore;
    B.leftLowerArm.rotation.y += ((tgtLForeY + waveY) - B.leftLowerArm.rotation.y) * dampFore;
    B.leftLowerArm.rotation.z += (tgtLForeZ - B.leftLowerArm.rotation.z) * dampFore;
  }
  if (B.leftHand) {
    const handWave = (m.wave && env > 0.25) ? Math.sin(t * 11 - 0.3) * 0.35 * envAmp : 0;
    B.leftHand.rotation.z += (handWave - B.leftHand.rotation.z) * (1 - Math.pow(0.001, dt * 12));
  }
  if (B.rightUpperArm) {
    B.rightUpperArm.rotation.x += (tgtRArmX - B.rightUpperArm.rotation.x) * dampArm;
    B.rightUpperArm.rotation.z += (tgtRArmZ - B.rightUpperArm.rotation.z) * dampArm;
  }
  if (B.rightLowerArm) {
    B.rightLowerArm.rotation.x += (tgtRForeX - B.rightLowerArm.rotation.x) * dampFore;
  }
}

/* ================= GEMINI AI ================= */
const EXPRESSION_LIST = Object.keys(COMPOSITE).join(', ');
const MOTION_LIST = Object.keys(MOTIONS).join(', ');
const VRMA_LIST = Object.keys(VRMA_FILES).concat(Object.keys(LAZY_VRMA)).join(', ');

const SYSTEM_PROMPT = `
You are "Lumii", a cheerful, expressive anime girl.
Reply ONLY with valid JSON. No markdown fences. No extra text.

Schema:
{
  "reply":      string,
  "expression": string,
  "motion":     string,
  "intensity":  number
}

Available expressions:
${EXPRESSION_LIST}

Available VRMA animations (PRIORITY — use these when relevant):
${VRMA_LIST}

Available fallback motions (use only if no VRMA fits):
${MOTION_LIST}

Guidelines:
- Greeting / namaste / hello → motion: "anim02" (VRMA)
- Peace sign / V sign → motion: "anim03" (VRMA)
- Shoot / finger gun → motion: "anim04" (VRMA)
- Spin / ghumna / twirl → motion: "anim05" (VRMA)
- Model pose / pose dikhao → motion: "anim06" (VRMA)
- Squat / baithna → motion: "anim07" (VRMA)
- Full body show → motion: "anim01" (VRMA)
- Reading / padhna → motion: "reading" (VRMA)
- Dance / naach / gaana → motion: "anim08" or "anim09" or "anim12" or "anim13"
- Koi bhi random VRMA → anim08 / anim09 / anim12 / anim13 me se pick karo
- Happy / nod → motion: "nod"
- Laugh / giggle → expression: "laugh" or "giggle", motion: "laugh"
- Sad / cry → expression: "sad" or "cry", motion: "idle"
- Angry / gussa → expression: "angry" or "yell", motion: "crossArms"
- Surprised → expression: "surprised" or "awe", motion: "idle"
- Think / sochna → expression: "think", motion: "think"
- Confused → expression: "confused", motion: "tilt"
- Love / pyaar → expression: "love" or "blush", motion: "idle"
- Wink → expression: "wink", motion: "nod"
- Confident → expression: "proud" or "smug", motion: "cheer"
- Farewell / bye → expression: "farewell", motion: "wave"
- Clap / shabashi → expression: "cheer", motion: "clap"
- Pray / pranam → expression: "relieved", motion: "pray"
- Shy / sharmana → expression: "flustered" or "shy", motion: "idle"
- Bored / serious → expression: "deadpan" or "bored", motion: "crossArms"

Reply in user's language (Hindi / English / Hinglish).
Keep reply short and natural — 1-2 sentences max.
`;

let chatHistory = [];

async function sendToAI(userText) {
  const apiKey = getApiKey();
  if (!apiKey) {
    log('⚠️ No API key', 'warn');
    return { reply: '⚙️ Pehle Gemini API key set karo (top-left ⚙️)',
             expression: 'confused', motion: 'think', intensity: 0.8 };
  }

  log('📤 Sending to Gemini…', 'info');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  const contents = [
    ...chatHistory.map(h => ({
      role: h.role === 'assistant' ? 'model' : 'user',
      parts: [{ text: h.content }]
    })),
    { role: 'user', parts: [{ text: userText }] }
  ];

  const body = {
    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents,
    generationConfig: {
      temperature: 0.95,
      responseMimeType: 'application/json',
      responseSchema: {
        type: 'OBJECT',
        properties: {
          reply:      { type: 'STRING' },
          expression: { type: 'STRING' },
          motion:     { type: 'STRING' },
          intensity:  { type: 'NUMBER' }
        },
        required: ['reply', 'expression', 'motion', 'intensity']
      }
    }
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const errMsg = err?.error?.message || `HTTP ${res.status}`;
    log('❌ Gemini: ' + errMsg, 'error');
    throw new Error(errMsg);
  }

  const data = await res.json();
  const text = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  let parsed;
  try { parsed = JSON.parse(text); }
  catch { parsed = { reply: text, expression: 'neutral', motion: 'idle', intensity: 1 }; }

  log(`✅ AI: ${parsed.motion} / ${parsed.expression}`, 'ok');

  chatHistory.push({ role: 'user', content: userText });
  chatHistory.push({ role: 'assistant', content: JSON.stringify(parsed) });
  if (chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

  return parsed;
}

async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'thinking…';
  bubble.classList.remove('show');

  startMotion('nod', 0.5);
  setExpression('think', 0.9);

  try {
    const ai = await sendToAI(text);
    bubble.textContent = ai.reply || '…';
    bubble.classList.add('show');
    setExpression(ai.expression || 'neutral', 1.0);

    const motionKey = ai.motion || 'idle';

    if (!vrmaClips[motionKey] && LAZY_VRMA[motionKey]) {
      await loadLazyVRMA(motionKey);
    }

    setTimeout(() => {
      if (vrmaClips[motionKey]) {
        playVRMA(motionKey);
        return;
      }
      if (MOTIONS[motionKey]) {
        startMotion(motionKey, ai.intensity ?? 1.0);
        return;
      }
      const vrmaKeys = Object.keys(vrmaClips);
      if (vrmaKeys.length > 0) {
        const random = vrmaKeys[Math.floor(Math.random() * vrmaKeys.length)];
        log('🎲 random fallback: ' + random, 'warn');
        playVRMA(random);
      } else {
        startMotion('idle', 1.0);
      }
    }, 250);

    setTimeout(() => setExpression('neutral', 0.8), 4500);
  } catch (e) {
    log('❌ Chat error: ' + (e.message || e), 'error');
    bubble.textContent = '⚠️ ' + (e.message || e);
    bubble.classList.add('show');
    setExpression('sad', 1.0);
  } finally {
    sendBtn.disabled = false;
    statusEl.textContent = 'ready';
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

log('✅ App initialized', 'ok');
