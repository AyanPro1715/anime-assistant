<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI VRM Chat</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  canvas { display: block; touch-action: none; }

  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1a1a2e; gap: 18px; padding: 24px; text-align: center;
  }
  #loading .title { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  #loading .sub { font-size: 14px; color: #ffffff80; max-width: 320px; line-height: 1.5; }
  #progressBar {
    width: min(280px, 70vw); height: 6px; border-radius: 3px;
    background: #ffffff18; overflow: hidden;
  }
  #progressFill {
    height: 100%; width: 0%; background: #ff6b9d;
    transition: width .2s ease;
  }
  #loading.hidden { display: none; }
  #errorBox {
    display: none; margin-top: 12px; padding: 12px 16px;
    background: #ff4d4d22; border: 1px solid #ff4d4d55; border-radius: 10px;
    font-size: 12px; color: #ffaaaa; max-width: 90vw; word-break: break-word;
    text-align: left; font-family: monospace;
  }

  #bubble {
    position: fixed; top: max(16px, env(safe-area-inset-top));
    left: 50%; transform: translateX(-50%);
    max-width: min(560px, 90vw); padding: 14px 20px; border-radius: 18px;
    background: #ffffff18; color: #fff; font-size: 15px; line-height: 1.4;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-left: 3px solid #ff6b9d; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 20;
  }
  #bubble.show { opacity: 1; }

  #chatBox {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(680px, 92vw); display: flex; gap: 8px; z-index: 10;
  }
  #userInput {
    flex: 1; padding: 14px 18px; border-radius: 30px; border: none; outline: none;
    background: #ffffff18; color: #fff; font-size: 15px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    min-width: 0;
  }
  #userInput::placeholder { color: #ffffff70; }
  #sendBtn {
    padding: 14px 22px; border-radius: 30px; border: none; cursor: pointer;
    background: #ff6b9d; color: #fff; font-weight: 600; font-size: 15px;
    flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }

  #status {
    position: fixed; top: max(6px, env(safe-area-inset-top));
    right: 10px; color: #ffffff80; font-size: 11px; z-index: 30;
    font-family: monospace;
  }
</style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <div class="title">🎀 AI VRM Chat</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="sub" id="loadText">Model load ho raha hai…</div>
    <div id="errorBox"></div>
  </div>

  <div id="bubble"></div>
  <div id="status">init…</div>

  <div id="chatBox">
    <input id="userInput" placeholder="Type hello…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

/* ================= CONFIG ================= */
const VRM_URL = './character.vrm?v=2';   // cache bust
const API_URL = '';                       // apna backend URL yahan
const API_KEY = '';                       // browser me kabhi mat daalo public repo me!

/* ================= DOM ================= */
const loadingEl = document.getElementById('loading');
const loadText  = document.getElementById('loadText');
const errorBox  = document.getElementById('errorBox');
const progressFill = document.getElementById('progressFill');
const statusEl  = document.getElementById('status');
const bubble    = document.getElementById('bubble');
const input     = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = String(msg);
  loadText.textContent = '❌ Load fail ho gaya';
}
function setProgress(pct) {
  progressFill.style.width = pct + '%';
}

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
camera.position.set(0, 1.35, 1.65);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(1, 2, 2);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88aaff, 0.6);
rimLight.position.set(-2, 1, -1);
scene.add(rimLight);

/* ================= VRM LOAD ================= */
let vrm = null;
const clock = new THREE.Clock();

const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(
  VRM_URL,
  (gltf) => {
    try {
      vrm = gltf.userData.vrm;
      if (!vrm) throw new Error('VRM data missing in GLTF');

      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.combineSkeletons(gltf.scene);
      if (VRMUtils.combineMorphs) VRMUtils.combineMorphs(vrm);

      vrm.scene.rotation.y = Math.PI;
      vrm.scene.position.set(0, 0, 0);
      scene.add(vrm.scene);

      statusEl.textContent = 'ready';
      loadingEl.classList.add('hidden');
      animate();
    } catch (e) {
      console.error(e);
      showError('Setup error: ' + (e.message || e));
    }
  },
  (progress) => {
    if (progress.total) {
      const pct = Math.round((progress.loaded / progress.total) * 100);
      setProgress(pct);
      loadText.textContent = `Model load ho raha hai… ${pct}%`;
      statusEl.textContent = pct + '%';
    } else {
      const mb = (progress.loaded / 1048576).toFixed(1);
      loadText.textContent = `Model load ho raha hai… ${mb} MB`;
    }
  },
  (err) => {
    console.error('VRM LOAD ERROR:', err);
    const msg = err?.message || err?.toString?.() || 'Unknown error';
    showError(msg);
    statusEl.textContent = 'failed';
  }
);

/* ================= EXPRESSIONS ================= */
const EXPRESSION_MAP = {
  happy: 'happy', joy: 'happy', smile: 'happy', cheer: 'happy',
  angry: 'angry', mad: 'angry',
  sad: 'sad', sorrow: 'sad',
  relaxed: 'relaxed', calm: 'relaxed',
  surprised: 'surprised', fear: 'surprised',
  neutral: 'neutral', normal: 'neutral'
};
const ALL_EXPRESSIONS = ['happy','angry','sad','relaxed','surprised','neutral'];

function setExpression(name, weight = 1.0) {
  if (!vrm?.expressionManager) return;
  const key = EXPRESSION_MAP[name] || 'neutral';
  const em = vrm.expressionManager;
  for (const n of ALL_EXPRESSIONS) em.setValue(n, 0);
  em.setValue(key, weight);
}

/* ================= MOTIONS ================= */
const MOTIONS = {
  idle:  { head:{x:0,y:0}, neck:{x:0,y:0}, spine:{x:0}, lArm:{x:0,z:-1.2}, rArm:{x:0,z:1.2}, duration:0 },
  nod:   { head:{x:0.28,y:0}, neck:{x:0.15,y:0}, spine:{x:0}, lArm:{x:0,z:-1.2}, rArm:{x:0,z:1.2}, duration:0.7 },
  shake: { head:{x:0,y:0.35}, neck:{x:0,y:0.15}, spine:{x:0}, lArm:{x:0,z:-1.2}, rArm:{x:0,z:1.2}, duration:0.7 },
  wave:  { head:{x:0.1,y:0.1}, neck:{x:0.05,y:0.05}, spine:{x:0}, lArm:{x:-1.4,z:-0.4}, rArm:{x:0,z:1.2}, duration:1.3, waveHand:true },
  think: { head:{x:0.15,y:0.2}, neck:{x:0.1,y:0.1}, spine:{x:0.05}, lArm:{x:-1.6,z:-0.3}, rArm:{x:0,z:1.2}, duration:1.6 },
  cheer: { head:{x:-0.1,y:0}, neck:{x:-0.05,y:0}, spine:{x:-0.05}, lArm:{x:-2.5,z:-0.5}, rArm:{x:-2.5,z:0.5}, duration:1.0 }
};

let motionName = 'idle';
let motionStart = performance.now();
let motionIntensity = 1.0;

function startMotion(name, intensity = 1.0) {
  motionName = MOTIONS[name] ? name : 'idle';
  motionIntensity = Math.max(0.3, Math.min(1.5, intensity || 1.0));
  motionStart = performance.now();
}

/* ================= ANIMATION LOOP ================= */
let blinkTimer = 0, blinkState = 'open', blinkNext = 2 + Math.random() * 3;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  if (vrm) {
    // Blink
    blinkTimer += dt;
    if (blinkState === 'open' && blinkTimer > blinkNext) { blinkState = 'closing'; blinkTimer = 0; }
    else if (blinkState === 'closing' && blinkTimer > 0.08) { blinkState = 'opening'; blinkTimer = 0; }
    else if (blinkState === 'opening' && blinkTimer > 0.08) {
      blinkState = 'open'; blinkTimer = 0; blinkNext = 2 + Math.random() * 3;
    }
    const blinkVal = blinkState === 'closing' ? 1 : 0;
    try { vrm.expressionManager?.setValue('blink', blinkVal); } catch {}

    // Idle breathing
    const chest = vrm.humanoid?.getNormalizedBoneNode('chest');
    if (chest) chest.rotation.x = Math.sin(t * 1.5) * 0.01;

    applyMotion(t, dt);
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}

function applyMotion(t, dt) {
  if (!vrm?.humanoid) return;
  const h = vrm.humanoid;
  const head  = h.getNormalizedBoneNode('head');
  const neck  = h.getNormalizedBoneNode('neck');
  const spine = h.getNormalizedBoneNode('spine');
  const lArm  = h.getNormalizedBoneNode('leftUpperArm');
  const rArm  = h.getNormalizedBoneNode('rightUpperArm');
  const lHand = h.getNormalizedBoneNode('leftHand');

  const elapsed = (performance.now() - motionStart) / 1000;
  const m = MOTIONS[motionName] || MOTIONS.idle;
  const amp = motionIntensity;

  if (m.duration > 0 && elapsed > m.duration + 0.4) {
    motionName = 'idle';
    motionStart = performance.now();
  }

  const tgt = {
    head:  { x: (m.head?.x || 0) * amp, y: (m.head?.y || 0) * amp },
    neck:  { x: (m.neck?.x || 0) * amp, y: (m.neck?.y || 0) * amp },
    spine: { x: (m.spine?.x || 0) * amp },
    lArm:  { x: (m.lArm?.x || 0) * amp, z: (m.lArm?.z ?? -1.2) },
    rArm:  { x: (m.rArm?.x || 0) * amp, z: (m.rArm?.z ?? 1.2) }
  };

  const lerp = 1 - Math.pow(0.001, dt * 6);
  if (head)  { head.rotation.x  += (tgt.head.x  - head.rotation.x)  * lerp;
               head.rotation.y  += (tgt.head.y  - head.rotation.y)  * lerp; }
  if (neck)  { neck.rotation.x  += (tgt.neck.x  - neck.rotation.x)  * lerp;
               neck.rotation.y  += (tgt.neck.y  - neck.rotation.y)  * lerp; }
  if (spine) { spine.rotation.x += (tgt.spine.x - spine.rotation.x) * lerp; }
  if (lArm)  { lArm.rotation.x  += (tgt.lArm.x  - lArm.rotation.x)  * lerp;
               lArm.rotation.z  += (tgt.lArm.z  - lArm.rotation.z)  * lerp; }
  if (rArm)  { rArm.rotation.x  += (tgt.rArm.x  - rArm.rotation.x)  * lerp;
               rArm.rotation.z  += (tgt.rArm.z  - rArm.rotation.z)  * lerp; }

  if (m.waveHand && lHand) lHand.rotation.z = Math.sin(t * 20) * 0.5;
}

/* ================= AI CHAT ================= */
const SYSTEM_PROMPT = `
You are "Lumii", a cheerful anime girl.
Reply ONLY with valid JSON, no markdown, no code fences.

Schema:
{
  "reply": string,
  "expression": "happy"|"angry"|"sad"|"relaxed"|"surprised"|"neutral",
  "motion": "idle"|"nod"|"shake"|"wave"|"think"|"cheer",
  "intensity": number
}
Reply in the user's language (Hindi / English / Hinglish).
`;

const chatHistory = [{ role: 'system', content: SYSTEM_PROMPT }];

async function sendToAI(userText) {
  if (!API_URL) {
    // Demo mode: no API — just local canned reply so you can test motions
    const canned = [
      { reply: 'Namaste! Main Lumii hoon 😊', expression: 'happy', motion: 'wave', intensity: 1.1 },
      { reply: 'Hmm, achha sawaal hai…', expression: 'neutral', motion: 'think', intensity: 0.9 },
      { reply: 'Haan haan, bilkul sahi!', expression: 'happy', motion: 'nod', intensity: 0.8 },
      { reply: 'Arre wah! Kya baat hai!', expression: 'surprised', motion: 'cheer', intensity: 1.2 }
    ];
    await new Promise(r => setTimeout(r, 400));
    return canned[Math.floor(Math.random() * canned.length)];
  }

  chatHistory.push({ role: 'user', content: userText });
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: chatHistory })
  });
  const data = await res.json();
  const raw = data?.reply || data?.choices?.[0]?.message?.content || '{}';
  let parsed;
  try { parsed = typeof raw === 'string' ? JSON.parse(raw) : raw; }
  catch { parsed = { reply: raw, expression: 'neutral', motion: 'idle', intensity: 1 }; }
  chatHistory.push({ role: 'assistant', content: JSON.stringify(parsed) });
  return parsed;
}

async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'thinking…';
  bubble.classList.remove('show');

  try {
    const ai = await sendToAI(text);
    bubble.textContent = ai.reply || '…';
    bubble.classList.add('show');
    setExpression(ai.expression || 'neutral', 1.0);
    startMotion(ai.motion || 'idle', ai.intensity ?? 1.0);
    setTimeout(() => setExpression('neutral', 1.0), 4000);
  } catch (e) {
    console.error(e);
    bubble.textContent = '⚠️ ' + (e.message || e);
    bubble.classList.add('show');
  } finally {
    sendBtn.disabled = false;
    statusEl.textContent = 'ready';
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

/* ================= RESIZE ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
