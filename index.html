<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>AI VRM Chat</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #1a1a2e; font-family: system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  canvas { display: block; touch-action: none; }
  #loading {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #1a1a2e; gap: 18px; padding: 24px; text-align: center;
  }
  #loading .title { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  #loading .sub { font-size: 14px; color: #ffffff80; max-width: 320px; line-height: 1.5; }
  #progressBar { width: min(280px, 70vw); height: 6px; border-radius: 3px; background: #ffffff18; overflow: hidden; }
  #progressFill { height: 100%; width: 0%; background: #ff6b9d; transition: width .2s ease; }
  #loading.hidden { display: none; }
  #errorBox {
    display: none; margin-top: 12px; padding: 12px 16px;
    background: #ff4d4d22; border: 1px solid #ff4d4d55; border-radius: 10px;
    font-size: 12px; color: #ffaaaa; max-width: 90vw; word-break: break-word;
    text-align: left; font-family: monospace;
  }
  #bubble {
    position: fixed; top: max(16px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
    max-width: min(560px, 90vw); padding: 14px 20px; border-radius: 18px;
    background: #ffffff18; color: #fff; font-size: 15px; line-height: 1.4;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-left: 3px solid #ff6b9d; opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 20;
  }
  #bubble.show { opacity: 1; }
  #chatBox {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(16px, env(safe-area-inset-bottom));
    width: min(680px, 92vw); display: flex; gap: 8px; z-index: 10;
  }
  #userInput {
    flex: 1; padding: 14px 18px; border-radius: 30px; border: none; outline: none;
    background: #ffffff18; color: #fff; font-size: 15px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); min-width: 0;
  }
  #userInput::placeholder { color: #ffffff70; }
  #sendBtn {
    padding: 14px 22px; border-radius: 30px; border: none; cursor: pointer;
    background: #ff6b9d; color: #fff; font-weight: 600; font-size: 15px; flex-shrink: 0;
  }
  #sendBtn:disabled { opacity: .5; cursor: not-allowed; }
  #status {
    position: fixed; top: max(6px, env(safe-area-inset-top)); right: 10px;
    color: #ffffff80; font-size: 11px; z-index: 30; font-family: monospace;
  }
</style>
</head>
<body>

  <div id="loading">
    <div class="title">🎀 AI VRM Chat</div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <div class="sub" id="loadText">Model load ho raha hai…</div>
    <div id="errorBox"></div>
  </div>

  <div id="bubble"></div>
  <div id="status">init…</div>

  <div id="chatBox">
    <input id="userInput" placeholder="Type hello…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.2.0/lib/three-vrm.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

/* ================= CONFIG ================= */
const VRM_URL = './character.vrm?v=5';
const API_URL = '';
const API_KEY = '';

/* ================= DOM ================= */
const loadingEl = document.getElementById('loading');
const loadText  = document.getElementById('loadText');
const errorBox  = document.getElementById('errorBox');
const progressFill = document.getElementById('progressFill');
const statusEl  = document.getElementById('status');
const bubble    = document.getElementById('bubble');
const input     = document.getElementById('userInput');
const sendBtn   = document.getElementById('sendBtn');

function showError(msg) {
  errorBox.style.display = 'block';
  errorBox.textContent = String(msg);
  loadText.textContent = '❌ Load fail ho gaya';
}

/* ================= SCENE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 20);
camera.position.set(0, 1.35, 1.65);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 1.2));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.4);
keyLight.position.set(1, 2, 2);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x88aaff, 0.6);
rimLight.position.set(-2, 1, -1);
scene.add(rimLight);

/* ================= VRM LOAD ================= */
let vrm = null;
const clock = new THREE.Clock();
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));

loader.load(VRM_URL, (gltf) => {
  try {
    vrm = gltf.userData.vrm;
    if (!vrm) throw new Error('VRM data missing');
    if (VRMUtils.removeUnnecessaryVertices) VRMUtils.removeUnnecessaryVertices(gltf.scene);
    if (VRMUtils.combineSkeletons) VRMUtils.combineSkeletons(gltf.scene);
    if (VRMUtils.combineMorphs) VRMUtils.combineMorphs(vrm);
    vrm.scene.rotation.y = 0;   // ✅ FACE FIX — camera ki taraf face
    vrm.scene.position.set(0, 0, 0);
    scene.add(vrm.scene);
    statusEl.textContent = 'ready';
    loadingEl.classList.add('hidden');
    captureBones();
    animate();
  } catch (e) {
    console.error(e);
    showError('Setup error: ' + (e.message || e));
  }
}, (progress) => {
  if (progress.total) {
    const pct = Math.round((progress.loaded / progress.total) * 100);
    progressFill.style.width = pct + '%';
    loadText.textContent = `Model load ho raha hai… ${pct}%`;
    statusEl.textContent = pct + '%';
  } else {
    loadText.textContent = `Model load ho raha hai… ${(progress.loaded / 1048576).toFixed(1)} MB`;
  }
}, (err) => {
  console.error(err);
  showError(err?.message || String(err));
  statusEl.textContent = 'failed';
});

/* ================= BONE CACHE ================= */
const bones = {};
function captureBones() {
  if (!vrm?.humanoid) return;
  const names = [
    'hips','spine','chest','upperChest','neck','head',
    'leftShoulder','rightShoulder',
    'leftUpperArm','rightUpperArm','leftLowerArm','rightLowerArm',
    'leftHand','rightHand',
    'leftUpperLeg','rightUpperLeg','leftLowerLeg','rightLowerLeg'
  ];
  for (const n of names) bones[n] = vrm.humanoid.getNormalizedBoneNode(n);
}

/* ================= EXPRESSIONS ================= */
const EXPRESSION_MAP = {
  happy:'happy', joy:'happy', smile:'happy', cheer:'happy',
  angry:'angry', mad:'angry',
  sad:'sad', sorrow:'sad',
  relaxed:'relaxed', calm:'relaxed',
  surprised:'surprised', fear:'surprised',
  neutral:'neutral', normal:'neutral'
};
const ALL_EXPR = ['happy','angry','sad','relaxed','surprised','neutral'];

const exprCur = { happy:0, angry:0, sad:0, relaxed:0, surprised:0, neutral:1 };
const exprTgt = { happy:0, angry:0, sad:0, relaxed:0, surprised:0, neutral:1 };

function setExpression(name, weight = 1.0) {
  const key = EXPRESSION_MAP[name] || 'neutral';
  for (const n of ALL_EXPR) exprTgt[n] = 0;
  exprTgt[key] = weight;
}

/* ================= MOTIONS ================= */
const MOTIONS = {
  idle:  { dur: 0,   headX:0,     headY:0,    neckX:0,     neckY:0,    spineX:0,     spineZ:0,    lArmX:0,     lArmZ:-1.15, rArmX:0,     rArmZ:1.15 },
  nod:   { dur: 0.7, headX:0.30,  headY:0,    neckX:0.15,  neckY:0,    spineX:0.05,  spineZ:0,    lArmX:0,     lArmZ:-1.15, rArmX:0,     rArmZ:1.15 },
  shake: { dur: 0.8, headX:0,     headY:0.35, neckX:0,     neckY:0.15, spineX:0,     spineZ:0,    lArmX:0,     lArmZ:-1.15, rArmX:0,     rArmZ:1.15 },
  wave:  { dur: 1.4, headX:0.05,  headY:0.1,  neckX:0.03,  neckY:0.05, spineX:0,     spineZ:0.03, lArmX:-1.5,  lArmZ:-0.35, rArmX:0,     rArmZ:1.15, wave:true },
  think: { dur: 1.6, headX:0.15,  headY:0.25, neckX:0.1,   neckY:0.12, spineX:0.05,  spineZ:-0.02,lArmX:-1.65, lArmZ:-0.25, rArmX:0,     rArmZ:1.15 },
  cheer: { dur: 1.1, headX:-0.12, headY:0,    neckX:-0.06, neckY:0,    spineX:-0.06, spineZ:0,    lArmX:-2.6,  lArmZ:-0.55, rArmX:-2.6,  rArmZ:0.55 }
};

let motionName = 'idle';
let motionStart = 0;
let motionIntensity = 1.0;

function startMotion(name, intensity = 1.0) {
  motionName = MOTIONS[name] ? name : 'idle';
  motionIntensity = Math.max(0.3, Math.min(1.4, intensity || 1.0));
  motionStart = performance.now();
}

/* ================= HELPERS ================= */
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeInOut(t) {
  return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
}
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

/* ================= ANIMATION LOOP ================= */
let blinkTimer = 0, blinkState = 'open', blinkNext = 2 + Math.random() * 3;
let blinkValue = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.getElapsedTime();

  if (vrm) {
    updateBlink(dt);
    updateExpressions(dt);
    updateBody(t, dt);
    vrm.update(dt);
  }
  renderer.render(scene, camera);
}

function updateBlink(dt) {
  blinkTimer += dt;
  if (blinkState === 'open' && blinkTimer > blinkNext) { blinkState = 'closing'; blinkTimer = 0; }
  else if (blinkState === 'closing' && blinkTimer > 0.06) { blinkState = 'opening'; blinkTimer = 0; }
  else if (blinkState === 'opening' && blinkTimer > 0.09) {
    blinkState = 'open'; blinkTimer = 0; blinkNext = 2 + Math.random() * 4;
  }
  const tgt = blinkState === 'closing' ? 1 : 0;
  blinkValue += (tgt - blinkValue) * (1 - Math.pow(0.001, dt * 20));
  try { vrm.expressionManager?.setValue('blink', blinkValue); } catch {}
}

function updateExpressions(dt) {
  if (!vrm?.expressionManager) return;
  const speed = 1 - Math.pow(0.001, dt * 6);
  for (const n of ALL_EXPR) {
    exprCur[n] += (exprTgt[n] - exprCur[n]) * speed;
    try { vrm.expressionManager.setValue(n, exprCur[n]); } catch {}
  }
}

function updateBody(t, dt) {
  if (!bones.head) return;
  const B = bones;

  /* 1. BREATHING */
  const breathPhase = t * 1.6;
  const breath = Math.sin(breathPhase) * 0.5 + 0.5;
  if (B.chest)  B.chest.rotation.x  = -0.02 + breath * 0.035;
  if (B.spine)  B.spine.rotation.x  = -0.005 + breath * 0.012;

  /* 2. WEIGHT SHIFT + SWAY */
  const swayPhase = t * 0.5;
  const swayX = Math.sin(swayPhase) * 0.008;
  const swayZ = Math.cos(swayPhase * 0.7) * 0.012;
  const bobY  = Math.sin(breathPhase * 2) * 0.004;

  if (B.hips) {
    B.hips.position.x = swayX;
    B.hips.position.y = bobY;
    B.hips.rotation.z = swayZ;
  }

  /* 3. HEAD MICRO-MOTION */
  const headIdleX = Math.sin(t * 0.9) * 0.015 + Math.sin(t * 2.3) * 0.006;
  const headIdleY = Math.cos(t * 0.7) * 0.02 + Math.sin(t * 1.9) * 0.008;

  /* 4. MOTION POSE */
  const elapsed = (performance.now() - motionStart) / 1000;
  const m = MOTIONS[motionName] || MOTIONS.idle;
  const amp = motionIntensity;

  let env = 0;
  if (m.dur > 0) {
    const riseT = 0.35;
    const holdT = m.dur - 0.15;
    if (elapsed < riseT) env = easeOutBack(elapsed / riseT);
    else if (elapsed < holdT) env = 1;
    else if (elapsed < m.dur + 0.5) {
      const k = (elapsed - holdT) / (m.dur + 0.5 - holdT);
      env = 1 - easeInOut(clamp(k, 0, 1));
    } else {
      motionName = 'idle';
      motionStart = performance.now();
    }
  }

  const envAmp = env * amp;

  const tgtHeadX = headIdleX + (m.headX || 0) * envAmp;
  const tgtHeadY = headIdleY + (m.headY || 0) * envAmp;
  const tgtNeckX = (m.neckX || 0) * envAmp;
  const tgtNeckY = (m.neckY || 0) * envAmp;
  const tgtSpineX = (m.spineX || 0) * envAmp;
  const tgtSpineZ = (m.spineZ || 0) * envAmp + swayZ * 0.3;
  const tgtLArmX = (m.lArmX || 0) * envAmp;
  const tgtLArmZ = (m.lArmZ ?? -1.15) + Math.sin(breathPhase + 0.3) * 0.01;
  const tgtRArmX = (m.rArmX || 0) * envAmp;
  const tgtRArmZ = (m.rArmZ ?? 1.15) + Math.sin(breathPhase + 0.3) * 0.01;

  /* 5. APPLY with damping */
  const dampHead  = 1 - Math.pow(0.001, dt * 5);
  const dampNeck  = 1 - Math.pow(0.001, dt * 6);
  const dampSpine = 1 - Math.pow(0.001, dt * 4.5);
  const dampArm   = 1 - Math.pow(0.001, dt * 7);

  if (B.head) {
    B.head.rotation.x += (tgtHeadX - B.head.rotation.x) * dampHead;
    B.head.rotation.y += (tgtHeadY - B.head.rotation.y) * dampHead;
    const roll = Math.sin(t * 0.6) * 0.01 + (m.headY || 0) * envAmp * 0.08;
    B.head.rotation.z += (roll - B.head.rotation.z) * dampHead;
  }
  if (B.neck) {
    B.neck.rotation.x += (tgtNeckX - B.neck.rotation.x) * dampNeck;
    B.neck.rotation.y += (tgtNeckY - B.neck.rotation.y) * dampNeck;
  }
  if (B.spine) {
    B.spine.rotation.x += (tgtSpineX - B.spine.rotation.x) * dampSpine;
    B.spine.rotation.z += (tgtSpineZ - B.spine.rotation.z) * dampSpine;
  }
  if (B.upperChest) {
    B.upperChest.rotation.x += ((m.spineX || 0) * envAmp * 0.5 - B.upperChest.rotation.x) * dampSpine;
  }
  if (B.leftUpperArm) {
    B.leftUpperArm.rotation.x += (tgtLArmX - B.leftUpperArm.rotation.x) * dampArm;
    B.leftUpperArm.rotation.z += (tgtLArmZ - B.leftUpperArm.rotation.z) * dampArm;
  }
  if (B.rightUpperArm) {
    B.rightUpperArm.rotation.x += (tgtRArmX - B.rightUpperArm.rotation.x) * dampArm;
    B.rightUpperArm.rotation.z += (tgtRArmZ - B.rightUpperArm.rotation.z) * dampArm;
  }

  /* 6. WAVE HAND */
  if (B.leftHand) {
    if (m.wave && env > 0.3) {
      const wave = Math.sin(t * 14) * 0.7 * envAmp;
      B.leftHand.rotation.z += (wave - B.leftHand.rotation.z) * (1 - Math.pow(0.001, dt * 15));
    } else {
      B.leftHand.rotation.z += (0 - B.leftHand.rotation.z) * (1 - Math.pow(0.001, dt * 5));
    }
  }

  if (B.leftLowerArm) {
    const lowerTgt = (m.wave && env > 0.3) ? -0.5 * envAmp : 0;
    B.leftLowerArm.rotation.x += (lowerTgt - B.leftLowerArm.rotation.x) * dampArm;
  }
  if (B.rightLowerArm) {
    B.rightLowerArm.rotation.x += (0 - B.rightLowerArm.rotation.x) * dampArm;
  }
}

/* ================= AI CHAT ================= */
const SYSTEM_PROMPT = `
You are "Lumii", a cheerful anime girl.
Reply ONLY with valid JSON, no markdown.

Schema:
{
  "reply": string,
  "expression": "happy"|"angry"|"sad"|"relaxed"|"surprised"|"neutral",
  "motion": "idle"|"nod"|"shake"|"wave"|"think"|"cheer",
  "intensity": number (0.3 to 1.4)
}
Reply in user's language (Hindi / English / Hinglish).
`;

const chatHistory = [{ role: 'system', content: SYSTEM_PROMPT }];

async function sendToAI(userText) {
  if (!API_URL) {
    const canned = [
      { reply: 'Namaste! Main Lumii hoon 😊', expression: 'happy', motion: 'wave', intensity: 1.1 },
      { reply: 'Hmm, achha sawaal hai…', expression: 'neutral', motion: 'think', intensity: 0.9 },
      { reply: 'Haan haan, bilkul sahi!', expression: 'happy', motion: 'nod', intensity: 0.8 },
      { reply: 'Arre wah! Kya baat hai!', expression: 'surprised', motion: 'cheer', intensity: 1.2 },
      { reply: 'Achha, samajh gayi!', expression: 'happy', motion: 'nod', intensity: 0.7 }
    ];
    await new Promise(r => setTimeout(r, 300));
    return canned[Math.floor(Math.random() * canned.length)];
  }
  chatHistory.push({ role: 'user', content: userText });
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: chatHistory })
  });
  const data = await res.json();
  const raw = data?.reply || data?.choices?.[0]?.message?.content || '{}';
  let parsed;
  try { parsed = typeof raw === 'string' ? JSON.parse(raw) : raw; }
  catch { parsed = { reply: raw, expression: 'neutral', motion: 'idle', intensity: 1 }; }
  chatHistory.push({ role: 'assistant', content: JSON.stringify(parsed) });
  return parsed;
}

async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = 'thinking…';
  bubble.classList.remove('show');

  startMotion('nod', 0.5);
  setExpression('happy', 0.6);

  try {
    const ai = await sendToAI(text);
    bubble.textContent = ai.reply || '…';
    bubble.classList.add('show');
    setExpression(ai.expression || 'neutral', 1.0);
    setTimeout(() => startMotion(ai.motion || 'idle', ai.intensity ?? 1.0), 250);
    setTimeout(() => setExpression('neutral', 0.8), 4000);
  } catch (e) {
    console.error(e);
    bubble.textContent = '⚠️ ' + (e.message || e);
    bubble.classList.add('show');
  } finally {
    sendBtn.disabled = false;
    statusEl.textContent = 'ready';
  }
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

/* ================= RESIZE ================= */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
