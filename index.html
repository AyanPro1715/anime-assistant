<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      --poster-color: transparent;
    }
  </style>
</head>
<body>
  <model-viewer
    id="character"
    src="character.glb"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="10deg"
    camera-orbit="0deg 80deg 3m"
    field-of-view="30deg"
    shadow-intensity="0"
    exposure="1"
    interaction-prompt="none"
    disable-zoom>
  </model-viewer>
</body>
</html>
